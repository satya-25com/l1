<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .entry-wrap {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
      text-align: center;
    }
    .intro-text {
      max-width: 600px;
      opacity: 0;
      animation: fadeInUp 2s var(--ease-cinematic) 0.5s forwards;
    }
    .intro-text .line1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--cream);
      margin-bottom: var(--sp-2);
    }
    .intro-text .line2 {
      font-family: var(--font-body);
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      color: var(--gold-light);
      font-style: italic;
    }
    .glowing-heart {
      font-size: 60px;
      margin: var(--sp-4) 0;
      display: inline-block;
      animation: heartBeat 2s ease-in-out infinite, fadeIn 2s ease forwards;
      opacity: 0;
      filter: drop-shadow(0 0 20px rgba(240, 182, 194, 0.6));
    }
    .unlock-card {
      max-width: 440px;
      width: 100%;
      padding: var(--sp-5);
      margin-top: var(--sp-4);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1.5s var(--ease-cinematic) 2.5s forwards;
    }
    .unlock-card h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--gold-light);
      margin-bottom: var(--sp-3);
    }
    .unlock-card .lock-icon {
      font-size: 32px;
      color: var(--gold);
      margin-bottom: var(--sp-2);
    }
    .pwd-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(5, 5, 5, 0.5);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      color: var(--cream);
      font-family: var(--font-ui);
      font-size: 16px;
      text-align: center;
      letter-spacing: 2px;
      transition: border-color var(--t-fast);
    }
    .pwd-input::placeholder { color: rgba(245, 236, 217, 0.3); }
    .pwd-input:focus { border-color: var(--gold); outline: none; }
    .pwd-error {
      color: var(--pink);
      font-family: var(--font-body);
      font-style: italic;
      margin-top: var(--sp-2);
      min-height: 24px;
      font-size: 1.05rem;
      opacity: 0;
      transition: opacity var(--t-med);
    }
    .pwd-error.show { opacity: 1; }
    .hint-text {
      margin-top: var(--sp-3);
      color: var(--cream-dim);
      font-family: var(--font-body);
      font-style: italic;
      font-size: 1rem;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all var(--t-slow) var(--ease-cinematic);
    }
    .hint-text.show {
      opacity: 1;
      max-height: 60px;
      margin-top: var(--sp-3);
    }
    .hint-btn {
      margin-top: var(--sp-2);
      font-size: 0.85rem;
      color: var(--gold-dim);
      font-family: var(--font-ui);
      letter-spacing: 1px;
      transition: color var(--t-fast);
    }
    .hint-btn:hover { color: var(--gold-light); }

    /* Unlock animation */
    .unlock-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-slow) var(--ease-cinematic);
    }
    .unlock-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .unlock-heart {
      font-size: 80px;
      transform: scale(0);
      transition: transform var(--t-epic) var(--ease-cinematic);
      filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.8));
    }
    .unlock-overlay.active .unlock-heart {
      transform: scale(3);
    }
    .unlock-msg {
      position: absolute;
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--gold-light);
      opacity: 0;
      transition: opacity var(--t-slow) ease 1.5s;
      text-align: center;
      padding: 0 var(--sp-4);
    }
    .unlock-overlay.active .unlock-msg { opacity: 1; }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <main class="entry-wrap">
    <div class="intro-text">
      <p class="line1">A little world was made for you… ❤️</p>
      <p class="line2">But it's locked.</p>
    </div>

    <div class="glowing-heart" aria-hidden="true">❤️</div>

    <div class="glass-strong unlock-card" role="region" aria-label="Unlock entry">
      <div class="lock-icon" aria-hidden="true">🔐</div>
      <h2>Unlock My Heart 🔐</h2>
      <form id="unlockForm" autocomplete="off">
        <input
          type="password"
          class="pwd-input"
          id="pwdInput"
          placeholder="Enter the secret"
          aria-label="Password"
          required
        />
        <div style="margin-top: var(--sp-3);">
          <button type="submit" class="btn-cinema"><span>Unlock ❤️</span></button>
        </div>
        <p class="pwd-error" id="pwdError" role="alert" aria-live="polite"></p>
      </form>
      <button class="hint-btn" id="hintBtn" type="button">Need a hint? 💌</button>
      <p class="hint-text" id="hintText"></p>
    </div>
  </main>

  <div class="unlock-overlay" id="unlockOverlay" aria-hidden="true">
    <div class="unlock-heart" aria-hidden="true">❤️</div>
    <p class="unlock-msg">Welcome to your world. ❤️</p>
  </div>

  <script src="script.js"></script>
  <script>
    initCommon();

    const form = document.getElementById('unlockForm');
    const input = document.getElementById('pwdInput');
    const error = document.getElementById('pwdError');
    const hintBtn = document.getElementById('hintBtn');
    const hintText = document.getElementById('hintText');
    const overlay = document.getElementById('unlockOverlay');

    hintBtn.addEventListener('click', () => {
      hintText.textContent = CONFIG.passwordHint;
      hintText.classList.add('show');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value;
      if (val === CONFIG.password) {
        error.classList.remove('show');
        // Unlock animation
        overlay.classList.add('active');
        explodeParticles(window.innerWidth / 2, window.innerHeight / 2, 60, ['#d4af37', '#f0b6c2', '#f5ecd9', '#f0d98a']);
        spawnPetals(20);
        setTimeout(() => {
          pageTransition('journey.html');
        }, 3500);
      } else {
        error.textContent = "Hmm… that's not it, my love. ❤️";
        error.classList.add('show');
        input.value = '';
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
