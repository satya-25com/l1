<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Journey ❤️</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .journey-wrap {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
    }
    .chapter-stage {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 80px rgba(0,0,0,0.7), 0 0 60px rgba(212,175,55,0.1);
      background: var(--midnight);
    }
    .chapter-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity var(--t-slow) var(--ease-cinematic);
    }
    .chapter-video.active { opacity: 1; }
    .chapter-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,5,5,0.3) 0%, transparent 30%, transparent 60%, rgba(5,5,5,0.85) 100%);
      pointer-events: none;
    }
    .chapter-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: var(--sp-5) var(--sp-4) var(--sp-4);
      text-align: center;
    }
    .chapter-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--cream);
      margin-bottom: var(--sp-2);
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(20px);
      transition: all var(--t-slow) var(--ease-cinematic);
    }
    .chapter-text {
      font-family: var(--font-body);
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      color: var(--gold-light);
      font-style: italic;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(20px);
      transition: all var(--t-slow) var(--ease-cinematic) 0.3s;
    }
    .chapter-content.show .chapter-title,
    .chapter-content.show .chapter-text {
      opacity: 1;
      transform: translateY(0);
    }

    /* Custom controls */
    .video-controls {
      position: absolute;
      bottom: var(--sp-3);
      right: var(--sp-3);
      display: flex;
      gap: var(--sp-1);
      z-index: 10;
    }
    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(5,5,5,0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212,175,55,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--cream);
      transition: all var(--t-fast);
    }
    .ctrl-btn:hover {
      border-color: var(--gold);
      color: var(--gold-light);
      transform: scale(1.1);
    }
    .ctrl-btn.big {
      width: 56px;
      height: 56px;
      font-size: 22px;
    }

    /* Chapter progress */
    .chapter-progress {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
      justify-content: center;
    }
    .ch-dot {
      font-family: var(--font-ui);
      font-size: 14px;
      letter-spacing: 1px;
      color: rgba(245, 236, 217, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all var(--t-med) var(--ease-cinematic);
      background: none;
      border: none;
    }
    .ch-dot:hover { color: var(--cream-dim); }
    .ch-dot.active {
      color: var(--gold-light);
      text-shadow: 0 0 15px rgba(212,175,55,0.6);
      transform: scale(1.2);
    }
    .ch-dot.done { color: var(--gold-dim); }

    .next-btn-wrap {
      margin-top: var(--sp-4);
      opacity: 0;
      transition: opacity var(--t-slow);
      text-align: center;
    }
    .next-btn-wrap.show { opacity: 1; }

    .chapter-fade {
      position: absolute;
      inset: 0;
      background: var(--black);
      z-index: 5;
      pointer-events: none;
      opacity: 1;
      transition: opacity var(--t-slow) var(--ease-cinematic);
    }
    .chapter-fade.clear { opacity: 0; }
  </style>
</head>
<body>
  <button class="music-btn" aria-label="Play music" type="button">🎵</button>

  <main class="journey-wrap">
    <div class="chapter-stage" id="stage">
      <!-- Videos are injected by JS -->
      <div class="chapter-overlay"></div>
      <div class="chapter-fade" id="chapterFade"></div>
      <div class="chapter-content" id="chapterContent">
        <h2 class="chapter-title" id="chapterTitle"></h2>
        <p class="chapter-text" id="chapterText"></p>
      </div>
      <div class="video-controls">
        <button class="ctrl-btn" id="replayBtn" aria-label="Replay" type="button"><i class="bi bi-arrow-repeat"></i></button>
        <button class="ctrl-btn big" id="playBtn" aria-label="Play/Pause" type="button"><i class="bi bi-play-fill"></i></button>
        <button class="ctrl-btn" id="muteBtn" aria-label="Mute/Unmute" type="button"><i class="bi bi-volume-mute"></i></button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next chapter" type="button"><i class="bi bi-skip-end-fill"></i></button>
      </div>
    </div>

    <div class="chapter-progress" id="progress" role="tablist" aria-label="Chapter navigation"></div>

    <div class="next-btn-wrap" id="finalBtnWrap">
      <button class="btn-cinema" onclick="pageTransition('memories.html')" type="button"><span>Open Our Memories →</span></button>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    initCommon();
    MusicPlayer.play(); // autoplay after unlock interaction

    const chapters = [
      { title: "This Is For You ❤️", text: "I made this little world just for you." },
      { title: "The Girl Behind My Smile ❤️", text: "Thank you for being the reason behind so many of my smiles." },
      { title: "Thank You For Supporting Me 🫂", text: "Thank you for believing in me.<br>Thank you for standing beside me." },
      { title: "The Little Things 🍲❤️", text: "Thank you for every little thing you do.<br>I notice them." },
      { title: "My Princess 👑", text: "You will always be my princess." },
      { title: "You Are My World 🌎❤️", text: "My happiness.<br>My peace.<br>My home.<br>My world." },
      { title: "I'd Choose You Again ❤️", text: "I'd still choose you.<br>Every single time." }
    ];

    const stage = document.getElementById('stage');
    const fadeEl = document.getElementById('chapterFade');
    const contentEl = document.getElementById('chapterContent');
    const titleEl = document.getElementById('chapterTitle');
    const textEl = document.getElementById('chapterText');
    const progressEl = document.getElementById('progress');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');
    const replayBtn = document.getElementById('replayBtn');
    const nextBtn = document.getElementById('nextBtn');
    const finalBtnWrap = document.getElementById('finalBtnWrap');

    let currentChapter = 0;
    let videos = [];
    let isMuted = false;

    // Create video elements (only load current + preload next)
    function createVideos() {
      CONFIG.videos.forEach((src, i) => {
        const v = document.createElement('video');
        v.className = 'chapter-video';
        v.preload = i === 0 ? 'auto' : 'metadata';
        v.setAttribute('playsinline', '');
        v.setAttribute('aria-label', `Chapter ${i + 1} video`);
        v.muted = true; // start muted to allow autoplay
        stage.insertBefore(v, stage.firstChild);
        videos.push(v);
      });
      videos[0].src = CONFIG.videos[0];
    }

    // Create progress dots
    function createProgress() {
      chapters.forEach((ch, i) => {
        const dot = document.createElement('button');
        dot.className = 'ch-dot';
        dot.textContent = String(i + 1).padStart(2, '0');
        dot.setAttribute('role', 'tab');
        dot.setAttribute('aria-label', `Chapter ${i + 1}`);
        dot.addEventListener('click', () => goToChapter(i));
        progressEl.appendChild(dot);
      });
    }

    function updateProgress() {
      [...progressEl.children].forEach((dot, i) => {
        dot.classList.remove('active', 'done');
        if (i < currentChapter) dot.classList.add('done');
        if (i === currentChapter) dot.classList.add('active');
      });
    }

    function goToChapter(index) {
      if (index < 0 || index >= chapters.length) return;
      const isForward = index > currentChapter;
      currentChapter = index;
      const prev = videos[index - 1];
      const next = videos[index + 1];

      // Fade out
      fadeEl.classList.remove('clear');
      contentEl.classList.remove('show');

      setTimeout(() => {
        // Deactivate all
        videos.forEach((v, i) => {
          if (i !== index) {
            v.classList.remove('active');
            v.pause();
          }
        });

        // Load current video if not loaded
        if (!videos[index].src) {
          videos[index].src = CONFIG.videos[index];
        }
        videos[index].classList.add('active');
        videos[index].muted = isMuted;
        videos[index].play().catch(() => {});

        // Preload next
        if (next && !next.src) {
          next.preload = 'auto';
          next.src = CONFIG.videos[index + 1];
        }

        // Update content
        titleEl.innerHTML = chapters[index].title;
        textEl.innerHTML = chapters[index].text;

        // Fade in
        fadeEl.classList.add('clear');
        requestAnimationFrame(() => {
          contentEl.classList.add('show');
        });

        updateProgress();

        // Show final button on last chapter
        if (index === chapters.length - 1) {
          setTimeout(() => finalBtnWrap.classList.add('show'), 2000);
        } else {
          finalBtnWrap.classList.remove('show');
        }
      }, 800);
    }

    // Controls
    playBtn.addEventListener('click', () => {
      const v = videos[currentChapter];
      if (v.paused) {
        v.play().catch(() => {});
        playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
      } else {
        v.pause();
        playBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
      }
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      videos[currentChapter].muted = isMuted;
      muteBtn.innerHTML = isMuted ? '<i class="bi bi-volume-mute"></i>' : '<i class="bi bi-volume-up"></i>';
    });

    replayBtn.addEventListener('click', () => {
      const v = videos[currentChapter];
      v.currentTime = 0;
      v.play().catch(() => {});
      playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
    });

    nextBtn.addEventListener('click', () => {
      if (currentChapter < chapters.length - 1) {
        goToChapter(currentChapter + 1);
      } else {
        pageTransition('memories.html');
      }
    });

    // Keyboard nav
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextBtn.click();
      if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
    });

    // Auto-advance when video ends
    function onVideoEnd() {
      if (currentChapter < chapters.length - 1) {
        goToChapter(currentChapter + 1);
      }
    }

    createVideos();
    createProgress();
    videos[0].addEventListener('ended', onVideoEnd);
    // Attach ended listener to all
    videos.forEach(v => {
      v.addEventListener('ended', () => {
        if (v === videos[currentChapter]) onVideoEnd();
      });
    });

    // Start
    setTimeout(() => goToChapter(0), 500);
  </script>
</body>
</html>
